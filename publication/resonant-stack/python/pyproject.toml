[project]
name = "resonant-stack"
version = "0.1.0"
description = "Validation and visualisation for The Resonant Spectral Stack"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kundai Farai Sachikonye", email = "claude@bitspark.com" },
]
dependencies = [
    "numpy>=1.26",
    "mpmath>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
resonant-stack = "resonant_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resonant_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
